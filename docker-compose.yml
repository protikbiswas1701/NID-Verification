services:
  mongodb:
    image: mongo:7.0
    container_name: nid-verify-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: nid_verify
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nid-verify-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/nid_verify
      JWT_SECRET: production_nid_secret_key_change_me_before_deploy
      CLIENT_URL: http://localhost,http://localhost:80,http://localhost:5173
      UPLOAD_DIR: private_uploads
      MAX_FILE_SIZE_MB: 10
    depends_on:
      - mongodb
    volumes:
      - backend_uploads:/app/private_uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nid-verify-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
